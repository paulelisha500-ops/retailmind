name: CI

# Every push and pull request is linted, unit-tested, built once, and driven end to end in a real browser (sharded
# for speed); the server edition is linted and tested on SQLite and on PostgreSQL alongside. A push to main then
# publishes the exact build that was tested - the same bytes - to GitHub Pages and to the Hugging Face Space, and
# checks that what is live matches.
#
# It all fits the free tiers: standard GitHub-hosted runners (free for public repositories), GitHub Pages, and a
# static Hugging Face Space, which needs no paid hardware.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a run that is publishing main; supersede stale branch and pull-request runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build · lint, unit tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (the in-browser engine)
        run: npm test

      - name: Production build
        run: npm run build

      # Built once, here. The test shards and both deploy jobs use this artifact, so what is tested is what ships.
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: End-to-end · shard ${{ matrix.shard }} of 3
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/dist

      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install the browser
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Desktop and phone layouts, offline mode, and the accessibility audit, against the production build.
      - name: Run this shard
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Keep what this shard exercised
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: frontend/test-results/coverage
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the report when something fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: No untested control
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Gather what every shard exercised
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: frontend/test-results/coverage

      # Lists every button, field and control in the source; the gate fails unless the suite used every one of them.
      - name: Census of interactive elements
        run: npm run census -- --json

      - name: Every control was exercised
        run: node scripts/coverage-gate.mjs

  server:
    name: Server edition · lint, SQLite, PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: retailmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retailmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # The API without the heavy forecasting libraries; workflow server-models.yml covers those.
      - run: python -m pip install -r requirements-test.txt

      - name: Lint
        run: ruff check .

      - name: Tests on SQLite
        run: python -m pytest

      # The same suite against the database the server edition runs on in production.
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/retailmind_test
        run: python -m pytest

  deploy-pages:
    name: Publish to GitHub Pages
    needs: [e2e, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the tested build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: The live site is the tested build
        run: python3 deploy/verify_live.py "${{ steps.deployment.outputs.page_url }}" --dist site --retries 12 --wait 10

  deploy-huggingface:
    name: Publish to Hugging Face
    needs: [e2e, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: huggingface
      cancel-in-progress: false
    environment:
      name: huggingface
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE || 'Elisha622/retailmind' }}
    env:
      # A write token for the account that owns the Space: Settings -> Secrets and variables -> Actions -> HF_TOKEN.
      # Optionally set the variable HF_SPACE (owner/name) to publish somewhere other than <token owner>/retailmind.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Is a token configured?
        id: gate
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hugging Face publishing skipped::Add a write token as the HF_TOKEN repository secret and this job publishes the Space on every push to main."
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Fetch the tested build
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/dist

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Hugging Face client
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install --quiet huggingface_hub

      - name: Publish the static Space
        if: steps.gate.outputs.enabled == 'true'
        run: python deploy/hf_space.py ${HF_SPACE:+--repo-id "$HF_SPACE"}

      - name: Mirror the source next to it
        if: steps.gate.outputs.enabled == 'true'
        run: python deploy/hf_mirror.py ${HF_SPACE:+--repo-id "$HF_SPACE" --space "$HF_SPACE"}

      - name: The live Space is the tested build
        if: steps.gate.outputs.enabled == 'true'
        run: |
          space="${HF_SPACE:-Elisha622/retailmind}"
          python deploy/verify_live.py "https://$(echo "$space" | tr '[:upper:]/' '[:lower:]-').static.hf.space/" --dist frontend/dist --retries 12 --wait 10
