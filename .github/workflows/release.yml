name: Release

# Pushing a version tag (git tag v1.2.0 && git push --tags) builds the site and attaches it to a GitHub release with
# generated notes, so anyone can download the exact static files and host them anywhere.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Package the site
        run: |
          cd dist
          zip -qr "../retailmind-site-${GITHUB_REF_NAME}.zip" .

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "retailmind-site-${GITHUB_REF_NAME}.zip" --title "RetailMind ${GITHUB_REF_NAME}" --generate-notes --verify-tag
