name: Feature request
description: An idea for something RetailMind should do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: Who is doing what, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Cashier, Forecast, Procurement, Monitoring, Warehouse, Analytics, Assistant, Team and access, Customer app, Platform and performance, Other]
