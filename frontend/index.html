<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RetailMind — retail operations platform</title>
    <meta name="description" content="Forecast demand, route procurement, watch the shelves and run the register — one console for retail operations." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RetailMind" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Before first paint: apply a saved light/dark choice (no flash), and note a visit that won't show the
      // landing page (a saved session, or a link to a screen) so the pre-rendered landing page stays hidden.
      try { var t = localStorage.getItem("retailmind_theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
      try { if (localStorage.getItem("retailmind_token") || (location.hash && location.hash !== "#" && location.hash !== "#/")) document.documentElement.setAttribute("data-boot", "app"); } catch (e) {}
    </script>
    <script>
      // The landing page's section links work from the first paint, before (and independent of) the app's script.
      document.addEventListener("click", function (e) {
        var link = e.target.closest && e.target.closest("[data-scroll]");
        var target = link && document.getElementById(link.getAttribute("data-scroll"));
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>RetailMind needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
